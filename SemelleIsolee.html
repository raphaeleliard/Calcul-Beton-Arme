<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcul Semelle Isolée - EC2 Assistant</title>
    <style>
        /* Variables de thème (héritées de l'index) */
        :root {
            --bg-color: #f4f7f6; --surface-color: #ffffff;
            --text-main: #2c3e50; --text-muted: #7f8c8d;
            --primary: #3498db; --primary-hover: #2980b9;
            --border-color: #e0e0e0; --shadow: 0 4px 10px rgba(0,0,0,0.08);
            --danger: #e74c3c; --warning: #f39c12; --success: #2ecc71;
            --transition: all 0.3s ease;
        }

        [data-theme="dark"] {
            --bg-color: #121212; --surface-color: #1e1e1e;
            --text-main: #e0e0e0; --text-muted: #a0a0a0;
            --primary: #4dabf7; --primary-hover: #3b8cd9;
            --border-color: #333333; --shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); color: var(--text-main); line-height: 1.5; }

        /* Header */
        header { background-color: var(--surface-color); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); }
        .back-link { color: var(--primary); text-decoration: none; font-weight: bold; }
        
        /* Layout : 3 panneaux */
        .dashboard { display: grid; grid-template-columns: 1fr; gap: 1.5rem; padding: 1.5rem; max-width: 1400px; margin: 0 auto; }
        @media (min-width: 1024px) { .dashboard { grid-template-columns: 300px 1fr 450px; } }

        .panel { background-color: var(--surface-color); border-radius: 12px; padding: 1.5rem; box-shadow: var(--shadow); border: 1px solid var(--border-color); }
        h2 { font-size: 1.2rem; margin-bottom: 1rem; color: var(--primary); border-bottom: 2px solid var(--border-color); padding-bottom: 0.5rem; }

        /* Formulaire */
        .input-group { margin-bottom: 1rem; }
        label { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 0.3rem; }
        input, select { width: 100%; padding: 0.5rem; border: 1px solid var(--border-color); border-radius: 6px; background: var(--bg-color); color: var(--text-main); }
        
        /* Panneau Central (Résultats) */
        .result-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .result-card { background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 8px; padding: 1rem; text-align: center; cursor: pointer; transition: var(--transition); }
        .result-card:hover { border-color: var(--primary); transform: translateY(-2px); }
        .result-value { font-size: 1.5rem; font-weight: bold; color: var(--primary); margin: 0.5rem 0; }
        .clickable-hint { font-size: 0.8rem; color: var(--text-muted); }

        /* Panneau Visuel */
        .status-badge { display: inline-block; padding: 0.5rem 1rem; border-radius: 20px; font-weight: bold; width: 100%; text-align: center; margin-bottom: 1rem; }
        .status-green {
