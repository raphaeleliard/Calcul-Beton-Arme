<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suite de Tests - EC2 Assistant</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .test-container { max-width: 900px; margin: 2rem auto; padding: 2rem; background: var(--surface-color); border-radius: 12px; box-shadow: var(--shadow); border: 1px solid var(--border-color); }
        .test-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; border-bottom: 2px solid var(--border-color); padding-bottom: 1rem; }
        .test-suite { margin-bottom: 2rem; }
        .test-case { padding: 10px; margin: 5px 0; border-radius: 6px; font-family: monospace; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border-color); background: var(--inner-bg); }
        .pass { border-left: 5px solid var(--success); }
        .fail { border-left: 5px solid var(--danger); background: rgba(231, 76, 60, 0.1); }
        .test-badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 0.8rem; }
        .badge-pass { background: rgba(46, 204, 113, 0.2); color: var(--success); }
        .badge-fail { background: rgba(231, 76, 60, 0.2); color: var(--danger); }
        .summary { font-size: 1.2rem; font-weight: bold; padding: 1rem; border-radius: 8px; text-align: center; margin-bottom: 1rem; }
        .summary.success { background: rgba(46, 204, 113, 0.2); color: var(--success); }
        .summary.error { background: rgba(231, 76, 60, 0.2); color: var(--danger); }
    </style>
</head>
<body>
    <header>
        <div class="logo">🏗️ EC2 Assistant - Tests</div>
        <a href="index.html" class="back-link">⬅ Retour à l'accueil</a>
    </header>
    <main class="test-container">
        <div class="test-header">
            <h2>🧪 Harnais de Tests Mathématiques (TDD)</h2>
            <div id="test-summary" class="summary">Exécution des tests en cours...</div>
        </div>
        
        <div id="test-results"></div>
    </main>

    <!--
        Les tests portent sur ec2-core.js, qui ne contient que des fonctions pures :
        aucun mock du DOM n'est nécessaire, et les six modules sont couverts par la
        même page. La même suite tourne en ligne de commande : `node tests-ec2.js`.
    -->
    <script src="ec2-core.js"></script>
    <script src="tests-ec2.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const resultsContainer = document.getElementById('test-results');
            const summaryContainer = document.getElementById('test-summary');
            const cases = EC2Tests.run();
            const passed = cases.filter(t => t.passed).length;

            resultsContainer.innerHTML = cases.map(t => `
                <div class="test-case ${t.passed ? 'pass' : 'fail'}">
                    <span><strong>${t.name}</strong><br>
                        Attendu : ${t.expected} | Obtenu : ${typeof t.actual === 'number' ? t.actual.toPrecision(6) : t.actual}
                        ${t.detail ? '<br>' + t.detail : ''}
                    </span>
                    <span class="test-badge ${t.passed ? 'badge-pass' : 'badge-fail'}">${t.passed ? 'PASS' : 'FAIL'}</span>
                </div>
            `).join('');

            summaryContainer.className = `summary ${passed === cases.length ? 'success' : 'error'}`;
            summaryContainer.innerText = `Résultats : ${passed} / ${cases.length} tests réussis.`;
        });
    </script>
</body>
</html>
